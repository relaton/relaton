# Releases the single gem this repo publishes: the combined `relaton`
# (every flavor bundled, relaton/cli and relaton/render included).
# Delegates to the shared relaton/support release workflow, same as every
# relaton gem.
#
# The compatibility shells (gems/relaton-cli, gems/relaton-render) are
# REMOVED: consumers depend on `relaton` alone. The already-published
# relaton-cli 3.1.0 shell stays on rubygems.org (unpublishable by
# design) and keeps satisfying legacy `relaton-cli ~> 3.0` resolvers
# through its `relaton >= 3.0.7, < 5` dependency; no further shell
# releases happen.
name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version: x.y.z / major / minor / patch / pre|rc|etc,
          or 'skip' to push the current versions without a version bump or tag.
        required: true
        default: 'skip'
  repository_dispatch:
    types: [ do-release ]

# Match the delegated relaton/support/release.yml token scope (a reusable
# workflow can't exceed the caller's grant): gem push via trusted publishing
# (id-token), tag + commit the version bump (contents), GitHub Packages
# (packages). Also satisfies CodeQL actions/missing-workflow-permissions.
permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  release:
    uses: relaton/support/.github/workflows/release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version || 'skip' }}
      # Non-'skip' bumps + tags the `relaton` version (lib/relaton/version.rb)
      # — the single source of truth.
      #
      # The shared workflow runs `release_command` ONLY on its API-key path.
      # On its OIDC (Trusted Publishing) path, which is the one this repo
      # takes, it ignores `release_command` and pushes just the root gemspec.
      release_command: |
        bundle exec rake build_all
        gem push pkg/relaton-*.gem
    secrets:
      rubygems-api-key: ${{ secrets.RELATON_CI_RUBYGEMS_API_KEY }}
