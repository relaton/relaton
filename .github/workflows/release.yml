# Releases the two gems this repo publishes: the combined `relaton` (every
# flavor bundled) and `relaton-cli`. Delegates to the shared relaton/support
# release workflow, same as every relaton gem — but with a custom release
# command so a single job (and a single git tag) publishes both gems.
name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version: x.y.z / major / minor / patch / pre|rc|etc,
          or 'skip' to push the current versions without a version bump or tag.
        required: true
        default: 'skip'
  repository_dispatch:
    types: [ do-release ]

# Match the delegated relaton/support/release.yml token scope (a reusable
# workflow can't exceed the caller's grant): gem push via trusted publishing
# (id-token), tag + commit the version bump (contents), GitHub Packages
# (packages). Also satisfies CodeQL actions/missing-workflow-permissions.
permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  release:
    uses: relaton/support/.github/workflows/release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version || 'skip' }}
      # Non-'skip' bumps + tags the `relaton` version (lib/relaton/version.rb)
      # — the single source of truth; relaton-cli derives its own version and
      # its exact `relaton` dependency from that file at build time.
      #
      # The shared workflow runs `release_command` ONLY on its API-key path. On
      # its OIDC (Trusted Publishing) path, which is the one this repo takes, it
      # ignores `release_command` and pushes just the root gemspec — so
      # relaton-cli is published by the `release-cli` job below instead. If the
      # API-key path is ever taken, this command pushes both gems and
      # `release-cli` sees relaton-cli already published and skips.
      release_command: |
        bundle exec rake build_all
        gem push pkg/relaton-*.gem
        gem push gems/relaton-cli/relaton-cli-*.gem
    secrets:
      rubygems-api-key: ${{ secrets.RELATON_CI_RUBYGEMS_API_KEY }}

  # Publishes the relaton-cli compatibility shell (version is literal in its
  # gemspec, independent of Relaton::VERSION; the already-published guard
  # keeps later cuts from re-pushing it). No Node: the frontend dist ships
  # inside the relaton gem now, committed under lib/relaton/cli/frontend/dist.
  # Publishes the relaton-render compatibility shell (same shape as the
  # relaton-cli shell: literal version, already-published guard).
  release-render:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: gems/relaton-render
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Read relaton-render version
        id: version
        run: echo "value=$(ruby -e 'puts Gem::Specification.load("relaton-render.gemspec").version')" >> "$GITHUB_OUTPUT"

      - name: Skip if already published
        id: guard
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if curl -sf https://rubygems.org/api/v1/versions/relaton-render.json |
            ruby -rjson -e 'exit JSON.parse($stdin.read).any? { |v| v["number"] == ENV["VERSION"] } ? 0 : 1'; then
            echo "::notice::relaton-render $VERSION is already on rubygems.org; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build gem
        if: steps.guard.outputs.skip != 'true'
        run: gem build relaton-render.gemspec

      - name: Configure RubyGems credentials for Trusted Publishing
        if: steps.guard.outputs.skip != 'true'
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      # The push authenticates via Trusted Publishing (the credentials
      # action above). It requires relaton-render's Trusted Publisher to
      # be REGISTERED on rubygems.org (repo relaton/relaton, workflow
      # release.yml, job release-render) — cli's is registered; render's
      # registration is pending, and until it lands the push fails with
      # "You are not allowed to push this gem."
      - name: Push gem
        if: steps.guard.outputs.skip != 'true'
        run: |
          gem push relaton-render-${{ steps.version.outputs.value }}.gem
          gem exec rubygems-await relaton-render-${{ steps.version.outputs.value }}.gem

  release-cli:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: gems/relaton-cli
    steps:
      # A branch name as `ref` checks out the branch tip, which includes the
      # version-bump commit `release` pushed after this run started.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Read relaton-cli version
        id: version
        run: echo "value=$(ruby -e 'puts Gem::Specification.load("relaton-cli.gemspec").version')" >> "$GITHUB_OUTPUT"

      - name: Skip if already published
        id: guard
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if curl -sf https://rubygems.org/api/v1/versions/relaton-cli.json |
            ruby -rjson -e 'exit JSON.parse($stdin.read).any? { |v| v["number"] == ENV["VERSION"] } ? 0 : 1'; then
            echo "::notice::relaton-cli $VERSION is already on rubygems.org; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build gem
        if: steps.guard.outputs.skip != 'true'
        run: gem build relaton-cli.gemspec

      - name: Configure RubyGems credentials for Trusted Publishing
        if: steps.guard.outputs.skip != 'true'
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push gem
        if: steps.guard.outputs.skip != 'true'
        run: |
          gem push relaton-cli-${{ steps.version.outputs.value }}.gem
          gem exec rubygems-await relaton-cli-${{ steps.version.outputs.value }}.gem
