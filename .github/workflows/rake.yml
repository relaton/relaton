name: rake

on:
  push:
    branches: [ main, master ]
    tags: [ v* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# The delegated relaton/support rake-monorepo.yml runs with contents: write for
# its tests-passed / release-readiness dispatch. A reusable workflow can't exceed
# the caller's token scope, so grant it explicitly (also satisfies CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: write

jobs:
  # Both gems — `relaton` at the repo root and `relaton-cli` under gems/ — run in
  # ONE matrix via the shared relaton/support monorepo workflow. A single strategy
  # (2 gems × ruby × os, Windows-first, max-parallel: 6) governs the whole run, so
  # the scarce Windows runners are not split between two racing jobs: all Windows
  # jobs sort to the front and start together. `include_root: true` adds the
  # repo-root gem (working directory "."); its `bundle exec rake` runs the default
  # `:spec` flavor suite. The workflow sets up Java for Jing/RelaxNG. Each gem
  # resolves its own bundle (relaton-cli's Gemfile pins `relaton` at `../..`).
  rake:
    # TODO: revert to @main after relaton/support#83 merges (dry-run pin).
    uses: relaton/support/.github/workflows/rake-monorepo.yml@ci/monorepo-include-root-java
    with:
      gem_directory: gems
      include_root: true
      root_gem_name: relaton
    secrets:
      pat_token: ${{ secrets.RELATON_CI_PAT_TOKEN }}
