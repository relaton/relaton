name: rake

on:
  push:
    branches: [ main, master ]
    tags: [ v* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# The delegated metanorma/ci generic-rake.yml fires its tests-passed / do-release
# cascade through pat_token; grant contents: write so the caller's token scope
# covers it (also satisfies CodeQL actions/missing-workflow-permissions).
permissions:
  contents: write

jobs:
  # One gem — `relaton` at the repo root, so the fleet-standard single-gem
  # workflow replaces the monorepo matrix. relaton-cli and relaton-render
  # consolidated into this gem (#462): gems/ holds only compatibility shells,
  # built and published by release.yml, with no per-gem CI. The root
  # `bundle exec rake` runs the default task, spec:all — the parallel flavor
  # run, then the moved spec/cli and spec/render suites. skip-java-setup:
  # RelaxNG validation is leptris; no Java in the test env.
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@main
    with:
      skip-java-setup: true
    secrets:
      pat_token: ${{ secrets.RELATON_CI_PAT_TOKEN }}
