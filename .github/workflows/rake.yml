name: rake

on:
  push:
    branches: [ main, master ]
    tags: [ v* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege per generic-rake's documented pattern: the cascade is off
# (this repo's release is manual workflow_dispatch, not do-release), so nothing
# here dispatches or pushes — contents: read covers it (also satisfies CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  # One gem — `relaton` at the repo root, so the fleet-standard single-gem
  # workflow replaces the monorepo matrix. relaton-cli and relaton-render
  # consolidated into this gem (#462): gems/ holds only compatibility shells,
  # built and published by release.yml, with no per-gem CI — no gems/ scan,
  # no caller-side skip-list. The root `bundle exec rake` runs the default
  # task, spec:all — the parallel flavor run, then the moved spec/cli and
  # spec/render suites. skip-java-setup: RelaxNG validation is leptris; no
  # Java in the test env.
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@main
    with:
      skip-java-setup: true
      # The cascade (tests-passed / do-release repository_dispatch) needs a PAT;
      # without one the PR-run GITHUB_TOKEN is rejected ("resource not
      # accessible by integration") — this repo has never had a working
      # dispatch flow (releases are manual workflow_dispatch), so skip it.
      cascade: false
