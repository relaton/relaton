name: rake

on:
  push:
    branches: [ main, master ]
    tags: [ v* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# The delegated relaton/support rake-monorepo.yml runs with contents: write for
# its tests-passed / release-readiness dispatch. A reusable workflow can't exceed
# the caller's token scope, so grant it explicitly (also satisfies CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: write

jobs:
# One gem — `relaton` at the repo root. The former relaton-cli and
# relaton-render shells are gone: their code lives in the root gem at
# lib/relaton/cli and lib/relaton/render (and consumers depend on
# `relaton` alone). The root job's `bundle exec rake` runs the default
# `:spec` flavor suite, and `rake spec:all` chains the spec/cli and
# spec/render suites.
  rake:
    uses: relaton/support/.github/workflows/rake-monorepo.yml@main
    with:
      include_root: true
      root_gem_name: relaton
      skip-java-setup: true # RelaxNG validation is leptris; no Java in the test env
    secrets:
      pat_token: ${{ secrets.RELATON_CI_PAT_TOKEN }}
