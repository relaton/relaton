# Each case: a query reference (parsed by the executing stack) and the index
# files expected to match (sorted). Match semantics are Pubid::Identifier#===
# as of pubid 2.0.0.pre.alpha.48; a case whose expectation pins a debatable
# behavior carries a `pinned:` note and points at the tracking issue.
cases:
- name: dated query hits its edition only (amendments are separate documents)
  query: "ISO 9001:2015"
  expect:
  - data/iso-9001-2015.yaml
- name: undated query spans the editions, not the amendment layer
  query: "ISO 9001"
  expect:
  - data/iso-9001-2015.yaml
  - data/iso-9001-2026.yaml
  - data/iso-9001-1-2025.yaml
- name: part disambiguates within the family
  query: "ISO 9001-1"
  expect:
  - data/iso-9001-1-2025.yaml
- name: cross-publisher number collision stays disjoint
  query: "IEC 1111:2021"
  expect:
  - data/iec-1111-2021.yaml
- name: undated query does not reach the supplement wrapper
  query: "IEC CA 01"
  expect:
  - data/iec-ca-01-2016.yaml
  - data/iec-ca-01-2017.yaml
- name: delivery-qualified query matches the wrapper exactly
  query: "IEC CA 01:2020 CSV"
  expect:
  - data/iec-ca-01-2020-csv.yaml
- name: base query misses the wrapper of the same edition
  pinned: wrappers are reachable only by delivery-qualified query or the
    family() view — a base query for the wrapped edition resolves to nothing
    when no bare base row exists. Relaton::Db consults family() for this;
    consumers of the raw index must too (pubid === semantics, alpha.48).
  query: "IEC CA 01:2020"
  expect: []
- name: family groups the edition ladder and the wrapper
  query: "IEC CA 01"
  family: true
  expect:
  - data/iec-ca-01-2016.yaml
  - data/iec-ca-01-2017.yaml
  - data/iec-ca-01-2020-csv.yaml
- name: amendment query hits the amendment layer, not its base
  query: "ISO 9001:2015/AMD 1:2022"
  expect:
  - data/iso-9001-2015-amd1-2022.yaml
- name: undated amendment query still names the amendment number
  query: "ISO 9001/AMD 1"
  expect:
  - data/iso-9001-2015-amd1-2022.yaml
- name: a part-less ECMA query does not reach the part row (strict part)
  flavor: ecma
  pinned: ECMA declares part subset_strict — a nil part means the document
    has none, so ECMA-418 must not answer with ECMA-418-1 (pubid#408).
  query: "ECMA-418"
  expect:
  - data/ecma-418.yaml
- name: the ECMA part query names its row exactly
  flavor: ecma
  query: "ECMA-418-1"
  expect:
  - data/ecma-418-1.yaml
- name: a joint query matches the fuller co-publication prefix
  pinned: collections match by position and the reference may be shorter —
    ISO/IEC states two of the row's three publishers.
  query: "ISO/IEC 15289"
  expect:
  - data/iso-iec-ieee-15289-2019.yaml
- name: the wrong co-publisher at a stated position does not match
  query: "ISO/IEEE 15289"
  expect: []
- name: the published default is stated — it does not match a draft row
  query: "ISO 9004"
  expect: []
- name: the stage-qualified query reaches the draft row
  query: "ISO/DIS 9004"
  expect:
  - data/iso-dis-9004-2024.yaml
- name: a typed query matches its own type only
  query: "ISO/TS 8000-1:2022"
  expect:
  - data/iso-ts-8000-1-2022.yaml
- name: the untyped query does not cross the type boundary
  query: "ISO 8000-1:2022"
  expect: []
