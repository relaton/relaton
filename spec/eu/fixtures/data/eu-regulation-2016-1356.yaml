  content: Règlement d'exécution (UE) 2016/1356 de la Commission du 9 août 2016
    modifiant le règlement d'exécution (UE) n° 1105/2010 instituant un droit antidumping
    définitif et portant perception définitive du droit provisoire sur les importations
    de fils de polyesters à haute ténacité originaires de la République populaire
    de Chine et clôturant la procédure concernant les importations de fils de polyesters
    à haute ténacité en provenance de la République de Corée et de Taïwan, modifié
    par le règlement d'exécution (UE) n° 907/2011
