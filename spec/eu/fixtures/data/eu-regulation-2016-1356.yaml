  script: Latn
  content: Commission Implementing Regulation (EU) 2016/1356 of 9 August 2016 amending
    Implementing Regulation (EU) No 1105/2010 imposing a definitive anti-dumping duty
    and collecting definitively the provisional duty imposed on imports of high tenacity
    yarn of polyesters originating in the People's Republic of China and terminating
    the proceeding concerning imports of high tenacity yarn of polyesters originating
    in the Republic of Korea and Taiwan, amended by Implementing Regulation (EU) No
    907/2011
  type: main
- language: fr
