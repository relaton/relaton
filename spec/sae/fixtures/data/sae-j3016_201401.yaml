  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Information Report provides a taxonomy for motor vehicle automation ranging in level from no automation to &lt;i&gt;full automation&lt;/i&gt;. However, it provides detailed definitions only for the highest three levels of automation provided in the taxonomy (namely, &lt;i&gt;conditional&lt;/i&gt;, &lt;i&gt;high&lt;/i&gt; and &lt;i&gt;full automation&lt;/i&gt;) in the context of &lt;i&gt;motor vehicles&lt;/i&gt; (hereafter also referred to as “&lt;i&gt;vehicle&lt;/i&gt;” or “&lt;i&gt;vehicles&lt;/i&gt;”) and their operation on public roadways. These latter levels of advanced automation refer to cases in which the &lt;i&gt;dynamic driving task&lt;/i&gt; is performed entirely by an &lt;i&gt;automated driving system&lt;/i&gt; during a given &lt;i&gt;driving mode&lt;/i&gt; or &lt;i&gt;trip&lt;/i&gt;. Popular, media, and legislative references to “autonomous” or “self-driving” vehicles encompass some or all of these levels of automation. These definitions can be used to describe the automation of (1) on-road &lt;i&gt;vehicles&lt;/i&gt;, (2) particular systems within those vehicles, and (3) the operation of those vehicles. “On-road” refers to public roadways that collectively serve users of &lt;i&gt;vehicles&lt;/i&gt; of all classes and automation levels (including no automation), as well as motorcyclists, pedal cyclists, and pedestrians.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not provide complete definitions applicable to lower levels of automation (namely, no automation, assisted, or partial automation), but they are described as points of reference to help bound the full range of vehicle automation. Active safety and driver assistance systems that partially and/or temporarily automate certain aspects of &lt;i&gt;vehicle&lt;/i&gt; operation (including systems that automatically intervene to avoid and/or mitigate an emergency situation and then immediately disengage), but otherwise rely on a &lt;i&gt;human driver&lt;/i&gt; to operate the motor vehicle in real time, are also not included within the &lt;i&gt;conditional&lt;/i&gt;, &lt;i&gt;high&lt;/i&gt;, and &lt;i&gt;full automation&lt;/i&gt; taxonomy types that are the focus of this document.&lt;/div&gt;&lt;/div&gt;</p>
