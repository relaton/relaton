    &lt;div class="htmlview paragraph"&gt;This technical report provides a taxonomy and classification of powered micromobility vehicles. These vehicles may be privately owned or be available via shared- or rental-fleet operations. This technical report does not provide specifications or otherwise impose minimum safety design requirements for powered micromobility vehicles.&lt;/div&gt;
