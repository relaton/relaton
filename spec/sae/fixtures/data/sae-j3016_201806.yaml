  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes &lt;i&gt;motor vehicle driving automation systems&lt;/i&gt; that perform part or all of the &lt;i&gt;dynamic driving task&lt;/i&gt; (&lt;i&gt;DDT&lt;/i&gt;) on a &lt;i&gt;sustained&lt;/i&gt; basis. It provides a taxonomy with detailed definitions for six levels of &lt;i&gt;driving automation,&lt;/i&gt; ranging from &lt;i&gt;no driving automation&lt;/i&gt; (level 0) to &lt;i&gt;full driving automation&lt;/i&gt; (level 5), in the context of &lt;i&gt;motor vehicles&lt;/i&gt; (hereafter also referred to as “&lt;i&gt;vehicle&lt;/i&gt;” or “&lt;i&gt;vehicles&lt;/i&gt;”) and their &lt;i&gt;operation&lt;/i&gt; on roadways. These level definitions, along with additional supporting terms and definitions provided herein, can be used to describe the full range of &lt;i&gt;driving automation features&lt;/i&gt; equipped on &lt;i&gt;motor vehicles&lt;/i&gt; in a functionally consistent and coherent manner. “On-road” refers to publicly accessible roadways (including parking areas and private campuses that permit public access) that collectively serve &lt;i&gt;users&lt;/i&gt; of &lt;i&gt;vehicles&lt;/i&gt; of all classes and &lt;i&gt;driving automation&lt;/i&gt; levels (including no &lt;i&gt;driving automation&lt;/i&gt;), as well as motorcyclists, pedal cyclists, and pedestrians.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The levels apply to the &lt;i&gt;driving automation feature(s)&lt;/i&gt; that are engaged in any given instance of on-road &lt;i&gt;operation&lt;/i&gt; of an equipped &lt;i&gt;vehicle&lt;/i&gt;. As such, although a given &lt;i&gt;vehicle&lt;/i&gt; may be equipped with a &lt;i&gt;driving automation system&lt;/i&gt; that is capable of delivering multiple &lt;i&gt;driving automation features&lt;/i&gt; that perform at different levels, the level of &lt;i&gt;driving automation&lt;/i&gt; exhibited in any given instance is determined by the &lt;i&gt;feature(s)&lt;/i&gt; that are engaged.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document also refers to three primary actors in driving: the (human) &lt;i&gt;user&lt;/i&gt;, the &lt;i&gt;driving automation system&lt;/i&gt;, and other &lt;i&gt;vehicle&lt;/i&gt; systems and components. These other &lt;i&gt;vehicle&lt;/i&gt; systems and components (or the &lt;i&gt;vehicle&lt;/i&gt; in general terms) do not include the &lt;i&gt;driving automation system&lt;/i&gt; in this model, even though as a practical matter a &lt;i&gt;driving automation system&lt;/i&gt; may actually share hardware and software components with other &lt;i&gt;vehicle&lt;/i&gt; systems, such as a processing module(s) or operating code.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The levels of &lt;i&gt;driving automation&lt;/i&gt; are defined by reference to the specific role played by each of the three primary actors in performance of the &lt;i&gt;DDT&lt;/i&gt; and/or &lt;i&gt;DDT fallback&lt;/i&gt;. “Role” in this context refers to the expected role of a given primary actor, based on the design of the &lt;i&gt;driving automation system&lt;/i&gt; in question and not necessarily to the actual performance of a given primary actor. For example, a &lt;i&gt;driver&lt;/i&gt; who fails to &lt;i&gt;monitor&lt;/i&gt; the roadway during engagement of a level 1 adaptive cruise control (ACC) system still has the role of &lt;i&gt;driver&lt;/i&gt;, even while s/he is neglecting it.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;Active safety systems&lt;/i&gt;, such as electronic stability control and automated emergency braking, and certain types of driver assistance systems, such as lane keeping assistance, are excluded from the scope of this &lt;i&gt;driving automation&lt;/i&gt; taxonomy because they do not perform part or all of the &lt;i&gt;DDT&lt;/i&gt; on a &lt;i&gt;sustained&lt;/i&gt; basis and, rather, merely provide momentary intervention during potentially hazardous situations. Due to the momentary nature of the actions of &lt;i&gt;active safety systems&lt;/i&gt;, their intervention does not change or eliminate the role of the &lt;i&gt;driver&lt;/i&gt; in performing part or all of the &lt;i&gt;DDT,&lt;/i&gt; and thus are not considered to be &lt;i&gt;driving automation&lt;/i&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It should, however, be noted that crash avoidance &lt;i&gt;features&lt;/i&gt;, including intervention-type &lt;i&gt;active safety systems&lt;/i&gt;, may be included in &lt;i&gt;vehicles&lt;/i&gt; equipped with &lt;i&gt;driving automation systems&lt;/i&gt; at any level. For &lt;i&gt;Automated Driving System (ADS) features&lt;/i&gt; (i.e., levels 3-5) that perform the complete &lt;i&gt;DDT&lt;/i&gt;, crash avoidance capability is part of &lt;i&gt;ADS&lt;/i&gt; functionality.&lt;/div&gt;&lt;/div&gt;</p>
