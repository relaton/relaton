# Reusable workflow: build a relaton-data-<flavor> index site with the
# `relaton index` command and publish it to GitHub Pages.
#
# This is the drop-in replacement for the Jekyll-theme build in
# relaton/support/.github/workflows/data-deploy.yml. Instead of checking out the
# `jekyll-theme-relaton-data-index` theme, merging _config.yml, and running
# `jekyll build`, it installs relaton-cli and runs a single command that reads
# ./data and emits a self-contained, crawler-indexable index (with the compiled
# Vue+Tailwind island inlined).
#
# PROPOSAL — this file belongs in the shared `relaton/support` repo (or, to pilot,
# copied into a single data repo's .github/workflows/). It is shipped inside the
# relaton-cli gem repo as a reference; it does not run from here.
#
# A data repo adopts it with a tiny caller workflow:
#
#   # relaton-data-<flavor>/.github/workflows/deploy.yml
#   name: Deploy
#   on:
#     push: { branches: [main, master, v2] }
#     workflow_dispatch:
#   jobs:
#     deploy:
#       uses: relaton/support/.github/workflows/data-deploy.yml@main
#       # with:
#       #   title: "BIPM Index"     # optional; defaults from the repo name
#       #   data-dir: data          # optional; default ./data
#       #   mode: embedded          # embedded | dom | static-json

name: Deploy index to Pages

on:
  workflow_call:
    inputs:
      title:
        description: "Index page title (defaults to '<FLAVOR> Index')"
        required: false
        type: string
      data-dir:
        description: "Folder of Relaton YAML documents"
        required: false
        default: "data"
        type: string
      mode:
        description: "Data delivery mode: embedded | dom | static-json"
        required: false
        default: "embedded"
        type: string
      relaton-cli-version:
        description: "Version of relaton-cli to install (default: latest)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build_index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install relaton-cli
        run: |
          if [ -n "${{ inputs.relaton-cli-version }}" ]; then
            gem install relaton-cli -v "${{ inputs.relaton-cli-version }}"
          else
            gem install relaton-cli
          fi

      - name: Derive title
        id: meta
        run: |
          title="${{ inputs.title }}"
          if [ -z "$title" ]; then
            flavor="${GITHUB_REPOSITORY##*/}"          # relaton-data-bipm
            flavor="${flavor#relaton-data-}"            # bipm
            title="$(echo "$flavor" | tr '[:lower:]' '[:upper:]') Index"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Build index site
        run: |
          relaton index "${{ inputs.data-dir }}" \
            --output _site \
            --mode "${{ inputs.mode }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Publish only from the repository's default branch.
    if: github.ref_name == github.event.repository.default_branch
    needs: build_index
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
