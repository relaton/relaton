# CSWP ids the CSRC pubs-export feed does not list (relaton#406).
#
# Source: the RIS files `bib/NIST.CSWP.*.ris` on the `nist-pages` branch of
# usnistgov/NIST-Tech-Pubs (the NIST Library MODS/MARC releases hold no CSWP).
#
# legacy: a dated id from before the series was numbered -> the numbered id,
#   matched by the exact RIS title (TI). A dated translation maps to the
#   numbered translation. `06222021-draft` has no numbered RIS; its title is
#   the CSRC `CSWP 19` initial public draft.
#   Not mapped: `02042022-1`..`-5` have no SN and share the title
#   "Cybersecurity White Paper: EO Response", so no numbered id matches.
#
# translations: numbered id + ISO 639-2 language code -> the RIS fields (TI,
#   PY, DO, AU). The original is the numbered id without the language code.
